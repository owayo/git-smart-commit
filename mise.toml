# Makefile 経由のローカル開発と CI で使うツールのバージョンを固定する。
# Rust は rustup 経由で導入するため、URL やチェックサムを固定する mise.lock は作らない。

[tools]
# プロファイルとコンポーネントを明示し、GitHub Actions の minimal 環境にも
# rustfmt / clippy を導入する。Apple Intelligence のビルドには、mise 管理外の
# Xcode（swiftc と macOS 26 以降の SDK）も必要。
rust = { version = "1.99.0", profile = "minimal", components = ["rustfmt", "clippy"] }
