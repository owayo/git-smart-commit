[package]
name = "git-sc"
version = "26.3.103"
edition = "2024"
authors = ["owayo <yoheiowa@gmail.com>"]
description = "AI-powered smart commit message generator with multi-provider fallback"
license = "MIT"

[features]
apple-ai = ["fm-rs"]

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
regex = "1.12.3"
colored = "3.1.1"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.6"
dirs = "6.0.0"
ignore = "0.4.25"

[target.'cfg(target_os = "macos")'.dependencies]
fm-rs = { version = "0.1.5", optional = true }

[dev-dependencies]
rstest = "0.26.1"
pretty_assertions = "1.4.1"
tempfile = "3.26.0"
assert_cmd = "2.1.2"
predicates = "3.1.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
