[package]
name = "git-sc"
version = "26.2.101"
edition = "2021"
authors = ["owayo <yoheiowa@gmail.com>"]
description = "Smart commit message generator using Gemini CLI"
license = "MIT"

[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
anyhow = "1.0.100"
thiserror = "2.0.18"
regex = "1.12.3"
colored = "3.1.1"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
dirs = "6.0.0"
ignore = "0.4.25"

[dev-dependencies]
rstest = "0.26.1"
pretty_assertions = "1.4.1"
tempfile = "3.24.0"
assert_cmd = "2.1.2"
predicates = "3.1.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
