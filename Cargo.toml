[package]
name = "git-sc"
version = "26.8.100"
edition = "2024"
authors = ["owayo <yoheiowa@gmail.com>"]
description = "AI-powered smart commit message generator with multi-provider fallback"
license = "MIT"

[features]
apple-ai = ["fm-rs"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
regex = "1.13.1"
colored = "3.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
dirs = "6.0.0"
ignore = "0.4.33"
shellexpand = "3.1.2"

[target.'cfg(target_os = "macos")'.dependencies]
fm-rs = { version = "=0.2.1", optional = true }

[dev-dependencies]
rstest = "0.26.1"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
